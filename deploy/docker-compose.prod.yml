services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qualification_media
      POSTGRES_USER: qualification_prod
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U qualification_prod -d qualification_media']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ..
    restart: unless-stopped
    command: ['node', 'dist/services/api/src/server.js']
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: '4100'
      DATABASE_URL: postgresql://qualification_prod:${DB_PASSWORD}@db:5432/qualification_media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4100/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ..
    restart: unless-stopped
    command: ['node', 'dist/apps/web/src/server.js']
    environment:
      NODE_ENV: production
      WEB_HOST: 0.0.0.0
      WEB_PORT: '3000'
      API_BASE_URL: http://api:4100
      SITE_ORIGIN: https://shikakucheck.com
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
