services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qualification_media
      POSTGRES_USER: qualification_dev
      POSTGRES_PASSWORD: qualification_dev
    ports: ['5432:5432']
    volumes: ['qualification-postgres:/var/lib/postgresql/data']
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local-only-placeholder
      MINIO_ROOT_PASSWORD: local-only-placeholder
    ports: ['9000:9000', '9001:9001']
    volumes: ['qualification-minio:/data']
volumes:
  qualification-postgres:
  qualification-minio:
